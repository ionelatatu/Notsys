spring.application.name=notsys

management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://localhost:5432/notsys
spring.datasource.username=notuser
spring.datasource.password=notpass

spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/notsys

spring.config.import=optional:file:.env[.properties]

notsys.keycloak.base-url=http://localhost:8180
notsys.keycloak.realm=notsys
notsys.keycloak.client-id=notsys-backend
notsys.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
